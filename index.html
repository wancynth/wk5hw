<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Responsive Web Design</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=League+Gothic">
    
    <style>
      .square {
        position: relative;
        height: 60vh;
        width: 85vw;
        background-color: blue;
        justify-self: center;
        align-self: end;
        animation-name: startup;
        animation-duration: 1s;
        z-index: -1;
        display: grid;
      }
      
    </style>
    
  </head>
  <body>
      <div class="container">
        
        <div class="title">
          <h1>
          POSTER<br>MOCKUP
          </h1>
        </div>
        
        <div class="asterisk-container">
             <div class="asterisk">*</div>
        </div>
        
      </div>
    <div class="square-container">
      <div class="square"></div>
    </div>
  </body>

</html>
